<!DOCTYPE html>
<html lang="ar" dir="rtl" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حاسبة نيوتن-رافسون الذكية</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#d946ef',
                        accent: '#ec4899',
                    }
                }
            }
        }
    </script>
    <!-- Math.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/11.8.0/math.js"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gray-50 dark:bg-gray-950 text-gray-800 dark:text-gray-100 min-h-screen transition-colors duration-300">

    <!-- Header Controls -->
    <header class="container mx-auto px-4 py-6 flex justify-between items-center border-b border-gray-200 dark:border-gray-800/80">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-purple-600 to-pink-500 flex items-center justify-center text-white font-bold shadow-lg shadow-pink-500/20">
                <i class="fa-solid fa-wand-magic-sparkles"></i>
            </div>
            <h1 id="app-title" class="text-xl font-bold bg-gradient-to-r from-purple-500 to-pink-500 bg-clip-text text-transparent">
                حاسبة نيوتن-رافسون الذكية
            </h1>
        </div>
        <div class="flex items-center gap-3">
            <button onclick="toggleLanguage()" class="px-4 py-2 rounded-xl bg-gray-200/80 dark:bg-gray-800 hover:bg-gray-300 dark:hover:bg-gray-700 font-semibold text-sm transition flex items-center gap-2">
                <i class="fa-solid fa-globe"></i>
                <span id="lang-btn-text">English</span>
            </button>
            <button onclick="toggleTheme()" class="w-10 h-10 rounded-xl bg-gray-200/80 dark:bg-gray-800 hover:bg-gray-300 dark:hover:bg-gray-700 flex items-center justify-center transition">
                <i id="theme-icon" class="fa-solid fa-moon text-pink-500"></i>
            </button>
        </div>
    </header>

    <!-- Main Content -->
    <main class="container mx-auto px-4 py-8 grid grid-cols-1 lg:grid-cols-3 gap-8">
        
        <!-- Controls Panel -->
        <div class="bg-white dark:bg-gray-900 rounded-3xl p-6 shadow-xl shadow-pink-500/5 border border-purple-100 dark:border-gray-800 lg:col-span-1 h-fit">
            <h2 id="settings-title" class="text-lg font-bold mb-4 flex items-center gap-2 text-purple-600 dark:text-purple-400">
                <i class="fa-solid fa-sliders"></i> إعدادات المسألة
            </h2>
            
            <form id="nr-form" onsubmit="event.preventDefault(); calculateRoot();" class="space-y-4">
                <div>
                    <label id="lbl-fx" class="block text-sm font-semibold mb-1">دالة المعادلة f(x):</label>
                    <input type="text" id="fx-input" placeholder="مثال: x^3 - 8*x + 5" required class="w-full px-4 py-2.5 rounded-2xl border border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-800 focus:outline-none focus:ring-2 focus:ring-pink-500 transition">
                </div>

                <div>
                    <label id="lbl-dfx" class="block text-sm font-semibold mb-1">المشتقة f'(x) (اختياري):</label>
                    <input type="text" id="dfx-input" placeholder="تلقائي" class="w-full px-4 py-2.5 rounded-2xl border border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-800 focus:outline-none focus:ring-2 focus:ring-pink-500 transition">
                </div>

                <div>
                    <label id="lbl-x0" class="block text-sm font-semibold mb-1">التخمين الأولي (x₀):</label>
                    <input type="number" step="any" id="x0-input" placeholder="مثال: 0" required class="w-full px-4 py-2.5 rounded-2xl border border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-800 focus:outline-none focus:ring-2 focus:ring-pink-500 transition">
                </div>

                <button type="submit" id="btn-calc" class="w-full py-3 rounded-2xl bg-gradient-to-r from-purple-600 to-pink-500 text-white font-bold shadow-lg shadow-pink-500/25 hover:opacity-95 transition flex items-center justify-center gap-2">
                    <i class="fa-solid fa-play"></i> احسب وحلل النتائج
                </button>
            </form>

            <div id="result-summary" class="mt-6 p-4 rounded-2xl bg-pink-50/80 dark:bg-purple-950/30 border border-pink-200 dark:border-purple-900/50 hidden space-y-2">
                <div>
                    <h3 id="lbl-root-found" class="text-xs font-semibold text-purple-600 dark:text-purple-300 mb-1">الجذر التقريبي المحسوب:</h3>
                    <p id="root-output" class="text-xl font-bold text-pink-600 dark:text-pink-400"></p>
                </div>
                <div id="convergence-box" class="pt-2 border-t border-pink-200/60 dark:border-purple-900/40 text-xs font-medium"></div>
            </div>
        </div>

        <!-- Output & Visualization Panel -->
        <div class="space-y-8 lg:col-span-2">
            <!-- Chart Container -->
            <div class="bg-white dark:bg-gray-900 rounded-3xl p-6 shadow-xl shadow-pink-500/5 border border-purple-100 dark:border-gray-800">
                <div class="flex justify-between items-center mb-4">
                    <h3 id="lbl-chart-title" class="text-lg font-bold flex items-center gap-2 text-purple-600 dark:text-purple-400">
                        <i class="fa-solid fa-chart-line"></i> الرسم البياني والمماسات الهندسية
                    </h3>
                </div>
                <div class="relative h-72 w-full">
                    <canvas id="functionChart"></canvas>
                </div>
            </div>

            <!-- Steps Table Container -->
            <div class="bg-white dark:bg-gray-900 rounded-3xl p-6 shadow-xl shadow-pink-500/5 border border-purple-100 dark:border-gray-800 overflow-hidden">
                <div class="flex justify-between items-center mb-4">
                    <h3 id="lbl-table-title" class="text-lg font-bold flex items-center gap-2 text-purple-600 dark:text-purple-400">
                        <i class="fa-solid fa-table-list"></i> جدول خطوات التكرار
                    </h3>
                    <button onclick="exportToPDF()" class="px-4 py-2 bg-gradient-to-r from-purple-600 to-pink-500 hover:opacity-90 text-white text-sm font-bold rounded-xl transition flex items-center gap-2 shadow-md shadow-pink-500/20">
                        <i class="fa-solid fa-file-pdf"></i> <span id="btn-pdf-text">تصدير تقرير PDF احترافي</span>
                    </button>
                </div>
                <div class="overflow-x-auto printable-area">
                    <table class="w-full text-right border-collapse">
                        <thead>
                            <tr id="table-header" class="border-b border-gray-100 dark:border-gray-800 text-sm text-gray-400 dark:text-gray-500">
                                <th class="py-3 px-4">i</th>
                                <th class="py-3 px-4">xᵢ</th>
                                <th class="py-3 px-4">f(xᵢ)</th>
                                <th class="py-3 px-4">f'(xᵢ)</th>
                                <th class="py-3 px-4">|xᵢ₊₁ - xᵢ|</th>
                            </tr>
                        </thead>
                        <tbody id="table-body" class="text-sm divide-y divide-gray-50 dark:divide-gray-800/60"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
